name: Apply automatic shop item behavior
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch automatic items
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # Add generic persistent stock helpers beside sword helpers.
          needle="function consumeSword(){if(window.StabiStock?.consume)return window.StabiStock.consume('sword');const n=Number(localStorage.getItem('stabi_stock_sword')||0);if(n<=0)return false;localStorage.setItem('stabi_stock_sword',String(n-1));return true}"
          add=needle+"\nfunction itemStock(k){return window.StabiStock?.stock?.(k) ?? Number(localStorage.getItem('stabi_stock_'+k)||0)}\nfunction consumeItem(k){if(window.StabiStock?.consume)return window.StabiStock.consume(k);const key='stabi_stock_'+k,n=Number(localStorage.getItem(key)||0);if(n<=0)return false;localStorage.setItem(key,String(n-1));return true}\nfunction autoRecovery(){if(lives===1 && itemStock('life')>0 && consumeItem('life')){lives=Math.min(3,lives+1);toast('💚 RECOVERY CORE AUTO USED!  LIFE ×'+itemStock('life'));try{beep(620,.1)}catch(_){}}}\nfunction autoShield(){if(itemStock('shield')>0 && consumeItem('shield')){P.shield=1;toast('🛡️ SHIELD AUTO ACTIVATED!  SHIELD ×'+itemStock('shield'));try{beep(760,.08)}catch(_){};return true}return false}\nfunction bootsAvailable(){return itemStock('boots')>0}\nfunction consumeBootsJump(){if(!bootsAvailable()||!consumeItem('boots'))return false;toast('👟 BOOTS DOUBLE JUMP!  BOOTS ×'+itemStock('boots'));try{beep(960,.08)}catch(_){};return true}"
          if needle in s and 'function autoRecovery()' not in s:s=s.replace(needle,add)
          # Recovery Core: whenever damage leaves one life, immediately restore one.
          s=s.replace('lives--;', 'lives--;autoRecovery();')
          # Existing collision shield check: if no active shield, consume purchased shield before damage.
          s=s.replace("if(P.shield){P.shield=0;", "if(!P.shield)autoShield();if(P.shield){P.shield=0;")
          # Extend jump allowance from normal jumps to a purchased Boots-assisted extra jump.
          # Cover common jump guards without changing base physics/skin behavior.
          s=s.replace('if(P.jumps<2){', "if(P.jumps<2 || (P.jumps>=2 && bootsAvailable() && consumeBootsJump())){")
          s=s.replace('if(P.jumps < 2){', "if(P.jumps < 2 || (P.jumps>=2 && bootsAvailable() && consumeBootsJump())){")
          p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/apply-auto-items.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-auto-items.yml
          git commit -m "Enable automatic Shield, Recovery Core, and Boots behavior" || exit 0
          git push
