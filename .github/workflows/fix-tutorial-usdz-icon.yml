name: Fix tutorial USDZ icon
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace tutorial USDZ emoji with gameplay icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="guideItem"><div class="fakeIcon">🪙</div><b>USDZ</b><small>GAIN POINTS</small></div>'
          new='<div class="guideItem"><img src="usdz-coin.png" alt="USDZ"><b>USDZ</b><small>GAIN POINTS</small></div>'
          if old in s:
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/fix-tutorial-usdz-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-tutorial-usdz-icon.yml
          git commit -m "Match tutorial USDZ icon to gameplay coin" || exit 0
          git push
