name: Fix actual skin render scaling
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch real drawPlayer skin scaling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old=""" ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality=(W<=650?'medium':'high');\n ctx.drawImage(sprite,drawX,drawY,baseW,baseH);\n ctx.restore();"""
          new=""" ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality=(W<=650?'medium':'high');\n const skinVisualScale=(equippedSkin==='cyber'||equippedSkin==='usdz')?STABI_SKIN_VISUAL_SCALE:1;\n const skinW=baseW*skinVisualScale, skinH=baseH*skinVisualScale;\n const skinX=drawX-(skinW-baseW)/2;\n const skinY=drawY-(skinH-baseH);\n ctx.drawImage(sprite,skinX,skinY,skinW,skinH);\n ctx.restore();"""
          if old not in s:
              raise SystemExit('drawPlayer target block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/fix-skin-render-real.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-skin-render-real.yml
          git commit -m "Apply real skin visual scaling in drawPlayer"
          git push
