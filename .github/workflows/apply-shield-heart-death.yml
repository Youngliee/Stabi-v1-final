name: Apply shield kill and full-heart core rules
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gameplay rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game.html')
          s=p.read_text()

          # 1) Shared enemy death state used by sword and shield.
          needle="function remove(e){const i=entities.indexOf(e);if(i>=0)entities.splice(i,1)}"
          add=needle+"\nfunction markEnemyDestroyed(e){if(!e||e.__destroyed)return false;e.__destroyed=true;e.__deathT=.65;e.hit=true;return true}"
          if 'function markEnemyDestroyed(e)' not in s:
              if needle not in s: raise SystemExit('remove() anchor not found')
              s=s.replace(needle,add,1)

          # 2) Shield collisions kill enemies with the same death state instead of instant removal.
          s=s.replace("try{window.StabiAudio?.SFX?.shield?.()}catch(_){} remove(e);return;",
                      "try{window.StabiAudio?.SFX?.shield?.()}catch(_){} markEnemyDestroyed(e);return;",1)
          s=s.replace("try{window.StabiAudio?.SFX?.shield?.()}catch(_){} remove(e);return;",
                      "try{window.StabiAudio?.SFX?.shield?.()}catch(_){} markEnemyDestroyed(e);return;",1)

          # 3) Sword uses the shared death state.
          s=s.replace(" e.__destroyed=true;\n return true;",
                      " markEnemyDestroyed(e);\n return true;",1)

          # 4) Destroyed enemies freeze, lose collision, then disappear after the death frame window.
          old=" for(const e of [...entities]){\n   e.x-=speed*dt*(e.type==='mev'?1.13:1);"
          new=" for(const e of [...entities]){\n   if(e.__destroyed){e.__deathT=(e.__deathT??.65)-dt;if(e.__deathT<=0)remove(e);continue}\n   e.x-=speed*dt*(e.type==='mev'?1.13:1);"
          if old not in s: raise SystemExit('entity update anchor not found')
          s=s.replace(old,new,1)

          # Sword should not instantly remove after marking dead.
          old="   if(trySwordSlash(e)){\n     remove(e);\n     continue;\n   }"
          new="   if(trySwordSlash(e)){\n     continue;\n   }"
          if old not in s: raise SystemExit('sword update anchor not found')
          s=s.replace(old,new,1)

          # 5) Heart pickup: heal if missing HP; if HP already full, bank it as CORE +1.
          old=" if(e.type==='heart'){lives=Math.min(3,lives+1);toast('+1 LIFE');beep(620,.1)}"
          new=" if(e.type==='heart'){if(lives<3){lives++;toast('+1 LIFE')}else{addItem('core',1);toast('💚 FULL LIFE • CORE +1 • CORE ×'+itemStock('core'))}beep(620,.1)}"
          if old not in s: raise SystemExit('heart anchor not found')
          s=s.replace(old,new,1)

          # 6) Load and render dedicated dead enemy sprites; Price Impact falls back to its final move frame.
          anchor="const customMonsters={};\n[['slippage','slippage_move.png'],['mev','mev_move.png'],['price','price_move.png'],['bot','bot_move.png']]\n.forEach(([k,u])=>{let i=new Image();i.src=u;customMonsters[k]=i});"
          death_loader=anchor+"\nconst deadMonsters={};\n[['slippage','slippage_dead.png'],['mev','mev_dead.png'],['bot','bot_dead.png']]\n.forEach(([k,u])=>{let i=new Image();i.src=u;deadMonsters[k]=i});\nfunction drawDeadEnemy(e){\n const key=e.type==='boss'?'bot':e.type;\n const img=deadMonsters[key];\n ctx.save();\n const left=Math.max(0,Math.min(.65,e.__deathT??.65));\n ctx.globalAlpha=left<.22?Math.max(0,left/.22):1;\n if(img&&img.complete&&img.naturalWidth){\n   const scale=e.type==='boss'?1.38:(e.type==='mev'?1.30:1.20);\n   const dw=e.w*scale,dh=dw*img.naturalHeight/img.naturalWidth;\n   ctx.drawImage(img,e.x+(e.w-dw)/2,e.y+e.h-dh,dw,dh);\n }else if(e.type==='spike'){drawCustomMonster(customMonsters.price,e,2,1.60)}\n else {\n   const move=customMonsters[key];\n   if(move)drawCustomMonster(move,e,2,e.type==='boss'?1.38:(e.type==='mev'?1.30:1.20));\n }\n ctx.restore();\n const label={slippage:['SLIPPAGE','#ff8290',8,-12],mev:['MEV','#ca9aff',9,-34],spike:['PRICE IMPACT','#ff9d78',7,-20],boss:['MEV BOT','#7de9ff',9,-22]}[e.type];\n if(label)drawPixelText(label[0],e.x+e.w/2,e.y+label[3],label[2],label[1],'center');\n return true;\n}"
          if 'const deadMonsters={};' not in s:
              if anchor not in s: raise SystemExit('monster loader anchor not found')
              s=s.replace(anchor,death_loader,1)

          draw_anchor="function drawEntity(e){\n const t=performance.now()/1000;"
          draw_new="function drawEntity(e){\n const t=performance.now()/1000;\n if(e.__destroyed&&['slippage','mev','spike','boss'].includes(e.type)){drawDeadEnemy(e);return}"
          if draw_anchor not in s: raise SystemExit('drawEntity anchor not found')
          s=s.replace(draw_anchor,draw_new,1)

          p.write_text(s)
          PY
      - name: Commit gameplay patch
        run: |
          rm -f .github/workflows/apply-shield-heart-death.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.html .github/workflows/apply-shield-heart-death.yml
          git commit -m "Shield kills enemies and full hearts become cores" || exit 0
          git push
