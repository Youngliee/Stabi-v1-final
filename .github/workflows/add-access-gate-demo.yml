name: Add community access gate demo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch access gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import random,string
          p=Path('index.html')
          s=p.read_text()
          if 'id="stabiAccessGate"' in s:
              raise SystemExit(0)
          rng=random.Random(20260826)
          codes=['STABI-TEST-01']
          while len(codes)<100:
              code='STABI-' + ''.join(rng.choice(string.ascii_uppercase+string.digits) for _ in range(4)) + '-' + ''.join(rng.choice(string.ascii_uppercase+string.digits) for _ in range(4))
              if code not in codes: codes.append(code)
          style='''<style id="stabiAccessStyle">\n#stabiAccessGate{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 15%,#123b38,#03100f 62%);display:flex;align-items:center;justify-content:center;padding:18px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}\n#stabiAccessGate.hidden{display:none}\n.stabiAccessCard{width:min(92vw,460px);background:linear-gradient(180deg,#103735,#082522);border:2px solid #5F918D;border-radius:18px;padding:22px;text-align:center;box-shadow:0 20px 70px #0009}\n.stabiAccessTitle{font-size:24px;font-weight:1000;color:#b0ffef}.stabiAccessSub{font-size:11px;color:#9ac0bb;margin:8px 0 16px;line-height:1.5}.stabiAccessInput{width:100%;padding:13px 14px;border-radius:10px;border:2px solid #2d7773;background:#061918;color:#effffc;text-align:center;font:1000 14px ui-monospace,monospace;text-transform:uppercase;outline:none}.stabiAccessBtn{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:2px solid #78ddce;background:#55c2b4;color:#05201d;font-weight:1000;cursor:pointer}.stabiAccessMsg{min-height:18px;margin-top:10px;font-size:10px;color:#ff9b9b}.stabiAccessNote{margin-top:12px;font-size:8px;color:#6f9892}\n</style>'''
          gate='''<div id="stabiAccessGate"><div class="stabiAccessCard"><div class="stabiAccessTitle">🔐 STABILIZER COMMUNITY ACCESS</div><div class="stabiAccessSub">Enter your community playtest code to unlock Stabi Runner.</div><input id="stabiAccessInput" class="stabiAccessInput" autocomplete="off" maxlength="20" placeholder="STABI-XXXX-XXXX"><button id="stabiAccessBtn" class="stabiAccessBtn">UNLOCK STABI RUNNER</button><div id="stabiAccessMsg" class="stabiAccessMsg"></div><div class="stabiAccessNote">Access is remembered on this browser after a valid code is entered.</div></div></div>'''
          js='''<script id="stabiAccessScript">\n(()=>{\nconst KEY='stabi_community_access_v1';\nconst CODES=new Set(%s);\nconst gate=document.getElementById('stabiAccessGate'),input=document.getElementById('stabiAccessInput'),btn=document.getElementById('stabiAccessBtn'),msg=document.getElementById('stabiAccessMsg');\nfunction unlock(){localStorage.setItem(KEY,'1');gate.classList.add('hidden');}\nif(localStorage.getItem(KEY)==='1') gate.classList.add('hidden');\nfunction submit(){const c=(input.value||'').trim().toUpperCase();if(CODES.has(c)){msg.style.color='#8ff0c8';msg.textContent='ACCESS GRANTED';setTimeout(unlock,280)}else{msg.style.color='#ff9b9b';msg.textContent='INVALID ACCESS CODE';}}\nbtn.addEventListener('click',submit);input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});\n})();\n</script>''' % repr(codes)
          s=s.replace('</head>',style+'\n</head>',1)
          s=s.replace('<body>','<body>\n'+gate,1)
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/add-access-gate-demo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-access-gate-demo.yml
          git commit -m "Add Stabilizer community access gate demo" || exit 0
          git push
