name: Fix MEV Bot spawn spacing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MEV Bot spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="let spawnClock=0,powerClock=0,waveClock=0,shake=0,flash=0,bossMode=false;"
          new="let spawnClock=0,powerClock=0,waveClock=0,shake=0,flash=0,bossMode=false,lastBossWorld=-9999;"
          if old in s and 'lastBossWorld=-9999' not in s:
              s=s.replace(old,new,1)
          old2="function spawn(type,extra={}){\n let e={type,x:W+60,y:0,w:44,h:44,hit:false,...extra};"
          new2="function spawn(type,extra={}){\n // Keep MEV Bots far enough apart so the player always has room to land.\n if(type==='boss'){\n   const BOSS_MIN_GAP=650; // world units (~65m)\n   if(world-lastBossWorld<BOSS_MIN_GAP)return;\n   lastBossWorld=world;\n }\n let e={type,x:W+60,y:0,w:44,h:44,hit:false,...extra};"
          if old2 in s and 'BOSS_MIN_GAP=650' not in s:
              s=s.replace(old2,new2,1)
          old3="spawnClock=.5;powerClock=0;waveClock=0;bossMode=false;"
          new3="spawnClock=.5;powerClock=0;waveClock=0;bossMode=false;lastBossWorld=-9999;"
          if old3 in s:
              s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          rm -f .github/workflows/boss-spacing-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/boss-spacing-fix.yml
          git commit -m "Keep MEV Bots at least 65m apart" || exit 0
          git push
