name: Add pregame skin selector
on:
  push:
    branches: [pregame-skin-test]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pregame-skin-test
      - name: Patch pre-game skin selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='STABI_PRE_GAME_SKIN_SELECTOR_V1'
          if marker in s:
              raise SystemExit(0)
          patch=r'''
<!-- STABI_PRE_GAME_SKIN_SELECTOR_V1 -->
<style>
#stabiSkinSelect{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 10%,#12413b 0,#061a18 42%,#020a09 100%);display:flex;align-items:center;justify-content:center;padding:16px;color:#effffc;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#stabiSkinSelect .ss-card{width:min(920px,96vw);max-height:92vh;overflow:auto;border:2px solid #3f7b74;border-radius:18px;background:linear-gradient(180deg,#0d302d,#071c1a);box-shadow:0 30px 90px #000;padding:18px}
#stabiSkinSelect .ss-kicker{color:#ffd75f;font-size:10px;letter-spacing:.16em;font-weight:900}
#stabiSkinSelect h2{margin:6px 0 4px;font-size:clamp(26px,6vw,44px)}
#stabiSkinSelect .ss-sub{color:#9ac0bb;font-size:11px;line-height:1.55;margin-bottom:14px}
#stabiSkinSelect .ss-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
#stabiSkinSelect .ss-item{border:2px solid #2d625d;background:#061918;border-radius:14px;padding:10px;text-align:center;cursor:pointer;transition:.16s transform,.16s border-color,.16s box-shadow}
#stabiSkinSelect .ss-item:hover{transform:translateY(-2px)}
#stabiSkinSelect .ss-item.active{border-color:#79e7d7;box-shadow:0 0 24px #6cd3c344,inset 0 0 18px #6cd3c322}
#stabiSkinSelect .ss-item img{width:100%;height:150px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 10px 14px #000)}
#stabiSkinSelect .ss-name{font-size:11px;font-weight:900;margin-top:6px;color:#dffbf6}
#stabiSkinSelect .ss-go{width:100%;margin-top:14px;border:2px solid #79e7d7;background:linear-gradient(#72dfcf,#45b8a8);color:#05201d;padding:13px;border-radius:11px;font:900 13px ui-monospace,monospace;cursor:pointer;box-shadow:inset 0 -4px #247d71}
#stabiSkinSelect .ss-note{margin-top:9px;color:#628c86;font-size:9px;text-align:center}
@media(max-width:720px){#stabiSkinSelect .ss-grid{grid-template-columns:repeat(2,1fr)}#stabiSkinSelect .ss-item img{height:115px}}
</style>
<div id="stabiSkinSelect" aria-modal="true" role="dialog">
  <div class="ss-card">
    <div class="ss-kicker">STABI RUNNER • PRE-RUN SETUP</div>
    <h2>SELECT YOUR SKIN</h2>
    <div class="ss-sub">Choose your character before the run. Skins are cosmetic and no longer need to be selected from the in-game shop.</div>
    <div class="ss-grid">
      <div class="ss-item" data-skin="default"><img src="skin-default-run-0.webp" alt="Default"><div class="ss-name">DEFAULT</div></div>
      <div class="ss-item" data-skin="cyber"><img src="skin-cyber-run-0.webp" alt="Cyber"><div class="ss-name">CYBER</div></div>
      <div class="ss-item" data-skin="legendary"><img src="skin-legendary-run-0.webp" alt="Legendary"><div class="ss-name">LEGENDARY</div></div>
      <div class="ss-item" data-skin="phase2"><img src="skin-phase2-run-0.webp" alt="Phase 2"><div class="ss-name">PHASE 2</div></div>
      <div class="ss-item" data-skin="usdz"><img src="skin-usdz-run-0.webp" alt="USDZ"><div class="ss-name">USDZ</div></div>
    </div>
    <button class="ss-go" id="stabiSkinGo">BEGIN RUN ▶</button>
    <div class="ss-note">Your last selection is remembered on this device.</div>
  </div>
</div>
<script>
(function(){
  const ids=['default','cyber','legendary','phase2','usdz'];
  const keys=['stabi_equipped_skin','stabi_skin_equipped','equippedSkin','stabiEquippedSkin','stabi_pre_game_skin'];
  let selected='default';
  for(const k of keys){try{const v=localStorage.getItem(k);if(ids.includes(v)){selected=v;break}}catch(_){}}
  const root=document.getElementById('stabiSkinSelect');
  const cards=[...root.querySelectorAll('.ss-item')];
  function paint(){cards.forEach(c=>c.classList.toggle('active',c.dataset.skin===selected))}
  function save(id){
    selected=id; paint();
    for(const k of keys){try{localStorage.setItem(k,id)}catch(_){}}
  }
  cards.forEach(c=>c.addEventListener('click',()=>save(c.dataset.skin)));
  paint();
  document.getElementById('stabiSkinGo').addEventListener('click',()=>{
    save(selected);
    try{if(typeof equippedSkin!=='undefined')equippedSkin=selected}catch(_){}
    try{if(typeof stabiApplyEquippedSkinNow==='function')stabiApplyEquippedSkinNow(selected)}catch(_){}
    try{if(typeof setSpriteState==='function')setSpriteState('run',true)}catch(_){}
    root.remove();
  });

  // Keep skin purchasing/equip cards out of the in-game shop. Equipment stays untouched.
  function hideShopSkinCards(scope=document){
    scope.querySelectorAll('img').forEach(img=>{
      const src=(img.getAttribute('src')||'').toLowerCase();
      if(!/^skin-(default|cyber|legendary|phase2|usdz)-/.test(src))return;
      if(img.closest('#stabiSkinSelect'))return;
      const card=img.closest('[data-shop-item],.shop-item,.shopItem,.store-item,.item-card,.skin-card,.skinCard,li');
      if(card)card.style.display='none';
    });
  }
  hideShopSkinCards();
  new MutationObserver(()=>hideShopSkinCards()).observe(document.body,{childList:true,subtree:true});
})();
</script>
'''
          pos=s.rfind('</body>')
          if pos<0: raise SystemExit('No </body> found')
          s=s[:pos]+patch+s[pos:]
          p.write_text(s)
          PY
      - name: Remove workflow and commit patch
        run: |
          rm -f .github/workflows/add-pregame-skin-select.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-pregame-skin-select.yml
          git commit -m "Move skin selection to pre-game screen" || exit 0
          git push origin pregame-skin-test
