name: Fix monster ground alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch MEV and MEV Bot ground alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_mev = "if(type==='mev'){e.w=64;e.h=48;e.y=fy-e.h-18}"
          new_mev = "if(type==='mev'){e.w=64;e.h=48;e.y=fy-e.h}"
          old_boss = "if(type==='boss'){e.w=110;e.h=110;e.y=fy-e.h}"
          new_boss = "if(type==='boss'){e.w=110;e.h=110;e.y=fy-e.h+8}"
          if old_mev not in s:
              raise SystemExit('MEV spawn pattern not found')
          if old_boss not in s:
              raise SystemExit('MEV Bot spawn pattern not found')
          s = s.replace(old_mev, new_mev, 1).replace(old_boss, new_boss, 1)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/fix-monster-ground.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-monster-ground.yml
          git commit -m "Fix MEV and MEV Bot ground alignment"
          git push
